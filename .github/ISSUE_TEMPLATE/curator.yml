name: 🗂️ 아키비스트에게 지시
description: 쌓인 산출물을 색인 한 장으로 정리합니다
title: "[아키비스트] "
labels: ["agent:curator"]
body:
  - type: markdown
    attributes:
      value: |
        리서처·라이터·메카닉의 산출물을 받아 `archive/INDEX.md`를 **처음부터 다시** 만듭니다.
        이어붙이는 게 아니라 통째로 덮어씁니다. 평소에는 매일 23:00 KST.

        ⚠️ **웹 검색을 못 합니다.** 받은 산출물 안에 있는 것만 다룰 수 있습니다.
        새 사실을 찾아오라는 지시는 리서처에게 하세요.
  - type: textarea
    id: instruction
    attributes:
      label: 지시
      description: 어떤 기준으로 묶을지, 무엇을 앞세울지.
      placeholder: |
        평소처럼 색인을 다시 만들되, 이번 주 초등 도서 글 두 편을 색인의 중심에 놓아라.

        - `## 초등 도서` 주제를 새로 만들어 맨 위에 두고 다른 주제보다 두껍게 쓴다
        - 나머지 주제(개발자 도구·증시·저장소 관리)는 그대로 유지한다
        - 두 글에 걸쳐 반복되는 사실만 "교차하는 사실"로 뽑는다
    validations:
      required: true
