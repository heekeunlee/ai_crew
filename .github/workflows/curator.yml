name: 아키비스트 근무

on:
  schedule:
    # 14:00 UTC = 같은 날 23:00 KST
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: agent-curator
  cancel-in-progress: false

jobs:
  work:
    # 재사용 워크플로에 넘길 권한은 여기서 정한다
    permissions:
      contents: write
    uses: ./.github/workflows/_agent.yml
    with:
      agent: curator
      emoji: "🗂️"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
