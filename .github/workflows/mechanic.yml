name: 메카닉 근무

on:
  schedule:
    # 00:00 UTC 월 = 09:00 KST 월
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-mechanic
  cancel-in-progress: false

jobs:
  work:
    uses: ./.github/workflows/_agent.yml
    with:
      agent: mechanic
      emoji: "🔧"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
