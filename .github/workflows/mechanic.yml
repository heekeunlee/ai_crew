name: 메카닉 근무

on:
  schedule:
    # 00:00 UTC 월 = 09:00 KST 월
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: agent-mechanic
  cancel-in-progress: false

jobs:
  work:
    # 재사용 워크플로에 넘길 권한은 여기서 정한다
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/_agent.yml
    with:
      agent: mechanic
      emoji: "🔧"
      issues: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
