name: 이슈 지시

# 이슈에 agent:<id> 라벨을 붙이면 그 에이전트가 집어간다.
# 이슈 하나가 칸반 카드 한 장이다.
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prep:
    # 이슈는 누구나 열 수 있다. 저장소 주인이 연 이슈만 받는다.
    # 이게 없으면 남이 이슈를 열어 내 Claude 사용량을 태울 수 있다.
    if: >-
      startsWith(github.event.label.name, 'agent:') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      agent: ${{ steps.pick.outputs.agent }}
      emoji: ${{ steps.pick.outputs.emoji }}
      ok: ${{ steps.pick.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        name: 라벨에서 에이전트 찾기
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          # 환경변수는 명령 앞에 붙여야 한다. 뒤에 두면 그냥 인자가 되고
          # process.env.AGENT_ID는 undefined가 된다.
          AGENT_ID="${LABEL#agent:}" node -e '
            const crew = require("./crew.json");
            const a = crew.agents.find(x => x.id === process.env.AGENT_ID);
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            if (!a) {
              out.write("ok=false\n");
              console.log(`crew.json에 "${process.env.AGENT_ID}" 에이전트가 없습니다.`);
            } else {
              out.write(`ok=true\nagent=${a.id}\nemoji=${a.emoji}\n`);
              console.log(`${a.emoji} ${a.id} 에게 맡깁니다.`);
            }
            out.end();
          '

      - name: 모르는 에이전트면 알려주기
        if: steps.pick.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
        run: |
          IDS=$(node -e "console.log(require('./crew.json').agents.map(a=>'agent:'+a.id).join(', '))")
          gh issue comment "${{ github.event.issue.number }}" --body \
            "라벨 \`$LABEL\` 에 해당하는 에이전트가 crew.json에 없습니다. 쓸 수 있는 라벨: $IDS"

  work:
    needs: prep
    if: needs.prep.outputs.ok == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/_agent.yml
    with:
      agent: ${{ needs.prep.outputs.agent }}
      emoji: ${{ needs.prep.outputs.emoji }}
      fromIssue: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
