name: 라이터 근무

on:
  schedule:
    # 00:00 UTC 토 = 09:00 KST 토
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: agent-quill
  cancel-in-progress: false

jobs:
  work:
    # 재사용 워크플로에 넘길 권한은 여기서 정한다
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/_agent.yml
    with:
      agent: quill
      emoji: "✍️"
      review: pull-request
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
