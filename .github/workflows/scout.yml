name: 리서처 근무

on:
  schedule:
    # 22:00 UTC = 다음날 07:00 KST
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: agent-scout
  cancel-in-progress: false

jobs:
  work:
    # 재사용 워크플로에 넘길 권한은 여기서 정한다
    permissions:
      contents: write
    uses: ./.github/workflows/_agent.yml
    with:
      agent: scout
      emoji: "🔭"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
