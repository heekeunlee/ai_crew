name: 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 포크 PR에 시크릿이 넘어가지 않도록 pull_request_target은 쓰지 않는다.
# 이 워크플로는 Claude를 부르지 않으므로 토큰 자체가 필요 없다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 단위 테스트
        run: npm test

      - name: 배관 점검 (Claude 호출 없음)
        env:
          DRY_RUN: "1"
        run: |
          D=$(TZ=Asia/Seoul date +%Y-%m-%d)
          for a in $(node -e "console.log(require('./crew.json').agents.map(x=>x.id).join(' '))"); do
            node scripts/run-agent.mjs "$a"
          done
          # DRY_RUN은 실제 산출물을 건드리지 않고 .ci/dry/ 아래에만 쓴다
          test -s ".ci/dry/work/scout/$D.md"        || { echo "리서처 산출물 없음"; exit 1; }
          test -s ".ci/dry/archive/INDEX.md"        || { echo "아키비스트 산출물 없음"; exit 1; }
          grep -q "$D" ".ci/dry/agents/scout/memory.md" || { echo "기억 갱신 안 됨"; exit 1; }
          git diff --quiet -- work/ archive/ agents/ \
            || { echo "DRY_RUN이 실제 파일을 건드렸습니다"; git diff --stat; exit 1; }
          echo "✓ 4명 전원 산출물 생성 · 기억 갱신 · 실제 파일 무변경 확인"
